<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{#insert title}{/} · Jev</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --accent: #4f46e5; --auto: #059669; --human: #d97706; --unsure: #fde68a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr); gap: 24px; padding: 24px 32px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .card + .card { margin-top: 16px; }
  h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  .submit { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
    font-weight: 600; cursor: pointer; }
  .row { display: grid; grid-template-columns: 170px 1fr 48px; align-items: center; gap: 10px; margin: 6px 0; }
  .row .name { font-size: 14px; }
  .row.top .name { font-weight: 700; }
  .bar { position: relative; height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: #c7d2fe; border-radius: 5px; }
  .row.top .bar i { background: var(--accent); }
  .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .error { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
  .spend { text-align: right; }
  .spend b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .spend span { display: block; color: var(--muted); font-size: 12px; }
  .placeholder { color: var(--muted); text-align: center; padding: 60px 20px; }
  textarea { width: 100%; min-height: 280px; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
  .examples button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px;
    font-size: 12px; cursor: pointer; }
  .band { position: absolute; top: 0; bottom: 0; left: 35%; width: 30%; background: var(--unsure); opacity: .6; }
  .dot { position: absolute; top: -1px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
    background: var(--ink); border: 2px solid #fff; }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-align: center; }
  .chip.NO { background: #d1fae5; color: var(--auto); }
  .chip.UNSURE { background: var(--unsure); color: #92400e; }
  .chip.YES { background: #fee2e2; color: #b91c1c; }
  .signal { grid-template-columns: 170px 1fr 64px; }
  nav { display: flex; align-items: center; gap: 4px; padding: 0 32px; background: var(--ink); }
  nav b { color: #fff; margin-right: 20px; font-size: 14px; }
  nav a { color: #c7cbd4; text-decoration: none; padding: 12px 14px; font-size: 14px; border-bottom: 3px solid transparent; }
  nav a:hover { color: #fff; }
  nav a[aria-current] { color: #fff; border-bottom-color: var(--accent); }
{#insert style}{/}</style>
</head>
<body>
<nav>
  <b>Jev from Java</b>
  <a href="/"{#if active == 'triage'} aria-current="page"{/if}>Support triage</a>
  <a href="/assistant"{#if active == 'assistant'} aria-current="page"{/if}>Voice assistant</a>
</nav>
{#insert /}
<script>
  document.querySelectorAll('.examples button').forEach(b =>
    b.addEventListener('click', () => { document.getElementById('message').value = b.dataset.text; }));
</script>
</body>
</html>
